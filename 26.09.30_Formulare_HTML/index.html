<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="mailto:lorenzd@spengergasse.at" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br><br>   
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>   
        <input type="dropdown" id="continent" name="continent">
        <label for="continent">Continent:</label>
        <select id="continent" name="continent">
            <option value="africa">Africa</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="north-america">North America</option>
            <option value="south-america">South America</option>
            <option value="oceania">Oceania</option>
            <option value="antarctica">Antarctica</option> 
        </select>
        <br><br>
        <label for="colour">Choose your favorite colours:</label>
        <br>
        <select name="colour" multiple>
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="yellow">Yellow</option>
            <option value="green">Green</option>
            <option value="orange">Orange</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="grey">Grey</option>
        </select>
        <br><br>
        <input type="checkbox" id="blackColour" name="blackColour" value="yes">
        <label for="blackColour">Black counts as a colour</label>
        <br><br>

        <textarea name="message" rows="4" cols="50" placeholder="Enter your useless argument against black being a colour here..."></textarea>
        <br><br>
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">

    </form>

    
</body>
</html>
